[project]
name = "pdf-chat"
version = "0.1.0"
description = ""
authors = [
    {name = "ansumanmindfire",email = "ansumanp@mindfiresolutions.com"}
]
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "pypdf (>=6.16.2,<7.0.0)",
    "langchain (>=1.3.18,<2.0.0)",
    "langchain-google-genai (>=4.3.7,<5.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "faiss-cpu (>=1.15.0,<2.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "streamlit (>=1.62.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
